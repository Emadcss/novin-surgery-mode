[project]
name = "novin-kiosk-api"
version = "0.1.0"
description = "API کیوسک پذیرش جراحی نوین دیدگان"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "jdatetime>=5.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
