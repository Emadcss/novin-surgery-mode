[package]
name = "novin-kiosk"
version = "0.1.0"
description = "کیوسک پذیرش جراحی نوین دیدگان"
edition = "2021"
rust-version = "1.77"

[lib]
name = "novin_kiosk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
