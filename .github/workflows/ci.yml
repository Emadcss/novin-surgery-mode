name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e "backend[dev]"
      - run: cd backend && pytest -q          # شامل تست قرارداد API (openapi.json و API.md)
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd frontend && npm ci && npm run gen:api && git diff --exit-code src/lib/api-schema.d.ts
      - run: cd frontend && npm run typecheck && npm test && npm run build
